# Database checks when the schema, the Edge Functions or the code they share changes: the local
# Supabase stack, the integration tests, pgTAP, the Deno tests, the schema linter and the
# generated-types drift check. Everything runs against a throwaway local stack, never the live
# project, so no secrets are needed.
name: db

on:
  pull_request:
    paths:
      - "supabase/**"
      - "src/backend/**"
      - "src/match/**"
      - "tests/db/**"
      - "scripts/**"
      - ".github/workflows/db.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "src/backend/**"
      - "src/match/**"
      - "tests/db/**"
      - "scripts/**"
      - ".github/workflows/db.yml"

permissions:
  contents: read

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db:
    name: local stack, pgTAP, integration, functions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      # The same CLI and Deno versions the repo is developed with.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.7.7

      - run: pnpm install --frozen-lockfile

      # Only the services the tests use: database, auth, REST, realtime and the API gateway.
      - run: supabase start -x studio,imgproxy,storage-api,mailpit,logflare,vector,supavisor

      # Resets the database, loads the 1,500-bean seed, serves the Edge Functions locally.
      - run: pnpm test:db

      - run: supabase test db

      - run: pnpm test:functions

      - run: supabase db lint --local --fail-on warning

      - run: pnpm db:types:check
