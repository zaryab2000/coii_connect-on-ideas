# The app in backend mode against a throwaway local Supabase stack, driven by Playwright: join,
# wave, chai, report, leave, adda, Telegram verify (e2e/backend, `pnpm test:e2e:backend`). About
# 6 minutes locally, more on a runner, so it runs nightly and by hand rather than on every PR. It
# also runs when the suite itself changes. No secrets: it never touches the live project.
name: e2e-backend

on:
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC = 01:30 IST
  workflow_dispatch:
  pull_request:
    paths:
      - "e2e/backend/**"
      - "playwright.backend.config.ts"
      - "scripts/test-e2e-backend.mjs"
      - ".github/workflows/e2e-backend.yml"

permissions:
  contents: read

concurrency:
  group: e2e-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-backend:
    name: backend-mode browser suite (local stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.7.7

      - run: pnpm install --frozen-lockfile

      - run: supabase start -x studio,imgproxy,storage-api,mailpit,logflare,vector,supavisor

      # Resets the database to the 1,500-bean seed, serves the Edge Functions locally, runs the
      # suite in the runner's Google Chrome.
      - run: pnpm test:e2e:backend

      # Traces and screenshots of the synthetic local data, to debug a red run.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-backend-results
          path: test-results/
          retention-days: 7
